# Connection settings for the Postgres container defined in the repo root's
# docker-compose.yml. Every value can be overridden through the environment
# (see .env.sample), so the same file serves local development and production.
#
# Note the port: docker-compose maps the container's 5432 to 5433 on your
# machine, so this stack never clashes with another Postgres you already run.
default: &default
  adapter: postgresql
  encoding: unicode
  # For details on connection pooling, see Rails configuration guide
  # https://guides.rubyonrails.org/configuring.html#database-pooling
  max_connections: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  host: <%= ENV.fetch("DATABASE_HOST", "127.0.0.1") %>
  port: <%= ENV.fetch("DATABASE_PORT", 5433) %>
  username: <%= ENV.fetch("DATABASE_USER", "tinta") %>
  password: <%= ENV.fetch("DATABASE_PASSWORD", "tinta") %>

development:
  <<: *default
  database: <%= ENV.fetch("DATABASE_NAME", "tinta_development") %>

# Warning: The database defined as "test" will be erased and
# re-generated from your development database when you run "rake".
# Do not set this db to the same as development or production.
test:
  <<: *default
  database: <%= ENV.fetch("TEST_DATABASE_NAME", "tinta_test") %>

# Managed providers (Neon, from task 0.8) hand out one connection string.
# Rails merges DATABASE_URL over whatever is configured here, so the URL wins
# whenever it is present — which is why no credentials are hardcoded below.
production:
  <<: *default
  url: <%= ENV["DATABASE_URL"] %>
